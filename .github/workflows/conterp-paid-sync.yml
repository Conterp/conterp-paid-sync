# .github/workflows/conterp-paid-sync.yml
name: CONTERP Paid Sync

on:
  # Executa manualmente pela aba "Actions"
  workflow_dispatch:

  # 🚨 Cron usa **UTC**. Ajuste se precisar de outro fuso.
  # Segunda (1) a Sábado (6) às 04:00, 10:30 e 19:00 UTC
  schedule:
    - cron: "0 7 * * 1-6"    # 04:00 BRT  → 07:00 UTC
    - cron: "30 13 * * 1-6"  # 10:30 BRT  → 13:30 UTC
    - cron: "0 22 * * 1-6"   # 19:00 BRT  → 22:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Evita execuções concorrentes do mesmo workflow
    concurrency:
      group: conterp-paid-sync
      cancel-in-progress: false

    # Variáveis de ambiente lidas dos Secrets do repositório
    env:
      ALTERDATA_USER: ${{ secrets.ALTERDATA_USER }}
      ALTERDATA_PASS: ${{ secrets.ALTERDATA_PASS }}
      ALTERDATA_BASE_URL: ${{ secrets.ALTERDATA_BASE_URL }}
      MONDAY_BASE_URL: ${{ secrets.MONDAY_BASE_URL }}
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      MONDAY_BOARD_ID: ${{ secrets.MONDAY_BOARD_ID }}
      MONDAY_COLUMN_ID: ${{ secrets.MONDAY_COLUMN_ID }}
      MONDAY_GROUP_PADRAO: ${{ secrets.MONDAY_GROUP_PADRAO }}
      MONDAY_GROUP_MOVBCO: ${{ secrets.MONDAY_GROUP_MOVBCO }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Rodar automação
        run: python -m src.main

      # (Opcional) Se quiser sempre ver versões de libs e Python
      - name: 🔎 Info ambiente (opcional)
        if: always()
        run: |
          python --version
          pip freeze | sort
